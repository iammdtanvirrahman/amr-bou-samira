<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00000f">
  <title>Ultra Realistic Night Sky</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>

  <div class="moon" aria-label="Moon">
    <img class="moon-phase-image" data-phase="0" src="./moon-new.png" alt="New Moon">
    <img class="moon-phase-image" data-phase="1" src="./moon-crescent-waxing.png" alt="Waxing Crescent">
    <img class="moon-phase-image" data-phase="2" src="./moon-quarter-first.png" alt="First Quarter">
    <img class="moon-phase-image" data-phase="3" src="./moon-gibbous-waxing.png" alt="Waxing Gibbous">
    <img class="moon-phase-image" data-phase="4" src="./moon-full.png" alt="Full Moon">
    <img class="moon-phase-image" data-phase="5" src="./moon-gibbous-waning.png" alt="Waning Gibbous">
    <img class="moon-phase-image" data-phase="6" src="./moon-quarter-last.png" alt="Last Quarter">
    <img class="moon-phase-image" data-phase="7" src="./moon-crescent-waning.png" alt="Waning Crescent">
  </div>

  <div id="floatingText" class="floating-text"></div>
  <script src="./script.js"></script>
</body>
</html>
