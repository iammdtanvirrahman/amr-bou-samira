<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00000f">
  <title>Ultra Realistic Night Sky</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#000 url('2.jpeg') center center / cover no-repeat fixed;min-height:100dvh;height:100vh;font-family:'Noto Sans Bengali',sans-serif;position:relative;-webkit-tap-highlight-color:transparent}
    body::before{content:"";position:absolute;inset:0;background:rgba(0,0,20,.18);z-index:0;pointer-events:none}
    .stars{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;z-index:1}
    .star{position:absolute;border-radius:50%;opacity:.85;animation:twinkle 2s infinite ease-in-out;will-change:opacity,transform}
    @keyframes twinkle{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.2;transform:scale(.7)}}
    .moon{position:absolute;top:15%;left:65%;width:180px;height:180px;background:radial-gradient(circle at 40% 40%,#fafafa,#dcdcdc 70%,#b0b0b0 100%);border-radius:50%;box-shadow:0 0 60px 30px rgba(255,255,255,.2),0 0 200px 60px rgba(200,200,255,.08);z-index:2}
    .crater{position:absolute;background:#999;border-radius:50%;opacity:.3}.crater1{top:40px;left:50px;width:20px;height:20px}.crater2{top:100px;left:90px;width:15px;height:15px}.crater3{top:60px;left:120px;width:25px;height:25px}.crater4{top:130px;left:40px;width:10px;height:10px}
    .floating-text{position:absolute;bottom:25%;left:5%;width:90%;color:#fff;font-size:28px;font-weight:700;text-align:center;line-height:1.6;z-index:3;animation:floatText 6s linear infinite;word-wrap:break-word;overflow-wrap:break-word;text-shadow:0 0 10px rgba(255,255,255,.8)}
    @keyframes floatText{0%{opacity:0;transform:translateY(20px)}15%{opacity:1;transform:translateY(0)}85%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(-40px)}}
    @media(max-width:600px){.moon{width:130px;height:130px;top:10%;left:auto;right:8%;box-shadow:0 0 45px 22px rgba(255,255,255,.2),0 0 140px 45px rgba(200,200,255,.08)}.crater1{top:29px;left:36px;width:15px;height:15px}.crater2{top:72px;left:65px;width:11px;height:11px}.crater3{top:43px;left:86px;width:18px;height:18px}.crater4{top:94px;left:29px;width:8px;height:8px}.floating-text{bottom:25%;font-size:24px}.star{min-width:1px;min-height:1px}}
    @media(max-width:380px){.moon{width:110px;height:110px;right:7%;top:10%}.floating-text{bottom:20%;font-size:22px}}
    @media(max-height:500px){.moon{width:100px;height:100px;top:5%;right:5%}.floating-text{bottom:10%;font-size:20px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="moon"><div class="crater crater1"></div><div class="crater crater2"></div><div class="crater crater3"></div><div class="crater crater4"></div></div>
  <div id="floatingText" class="floating-text"></div>
  <script>
    const starsContainer=document.querySelector('.stars');
    const starColors=['#ffffff','#dbeafe','#93c5fd','#67e8f9','#c4b5fd','#f0abfc','#fde68a','#fed7aa','#a7f3d0'];
    for(let i=0;i<650;i++){
      const star=document.createElement('div');star.className='star';
      const size=Math.random()<.88?Math.random()*1.7+.7:Math.random()*3+1.5;
      const color=starColors[Math.floor(Math.random()*starColors.length)];
      star.style.top=Math.random()*100+'%';star.style.left=Math.random()*100+'%';
      star.style.width=size+'px';star.style.height=size+'px';star.style.backgroundColor=color;
      star.style.boxShadow=`0 0 ${size>2.2?9:4}px ${color}`;
      star.style.animationDuration=(Math.random()*3+1.2)+'s';star.style.animationDelay=(Math.random()*4)+'s';
      starsContainer.appendChild(star);
    }
    const messages=["ওগো আমার মায়াবতী সামিরা...।","তুমি আমার জীবনে ঐ চাঁদটার চেয়েও বেশি সুন্দর, বেশি স্পেশাল।","তুমি আমার মায়াবতী রাজকন্যা, আমার মিষ্টি বউ, সুন্দরী আমার...","আমি যদি অর্ফিয়াসের হতাম, সারাটি জীবন শুধু তোমার জন্যই বাঁশি বাজাতাম।","দা ভিঞ্চি হলে সারাজীবন তোমাকেই আঁকতাম।","শেক্সপিয়ার হলে তুমি হতে আমার গল্পের নায়িকা।","আমি যদি শাহজাহান হতাম, তুমি হতে আমার মমতাজ।","তুমি আছো বলেই আমার রাতগুলো এত সুন্দর, চাঁদ যেন তোমারই প্রতিবিম্ব।","তোমার হাসি আমাকে অন্ধকারেও পথ দেখায়।","তুমি ছাড়া আমি অসম্পূর্ণ — এক অপূর্ণ গল্পের নায়ক।","তোমাকে ভালোবাসি তারাও জানে, রাতের আকাশই তার সাক্ষী।","ইতি কেবল তোমারই তানভীর"];
    let index=0;const floatingText=document.getElementById('floatingText');
    function showNextMessage(){floatingText.textContent=messages[index];floatingText.style.animation='none';void floatingText.offsetWidth;floatingText.style.animation=null;index=(index+1)%messages.length}
    showNextMessage();setInterval(showNextMessage,6000);
  </script>
</body>
</html>
